name: Static Analysis & Unit Tests
on: push

jobs:
  testing:
    runs-on: ubuntu-latest
    container:
      image: artefact.skao.int/ska-tango-images-pytango-builder:9.3.10
    steps:
      - uses: actions/checkout@v1
      - name: Configure Debian archive repositories
        run: |
          set -eux
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e 's|security.debian.org|archive.debian.org/debian-security|g' \
            -e 's|ftp.debian.org/debian|archive.debian.org/debian|g' \
            /etc/apt/sources.list

          # Archived Debian repositories have expired Release metadata.
          printf 'Acquire::Check-Valid-Until "false";\n' \
            > /etc/apt/apt.conf.d/99debian-archive
          apt-get update
      - name: Install flake8
        run: sudo pip3 install flake8
      - name: Get and tailor the sardana linting script
        run: |
          sudo apt-get install -y wget && \
          wget -O lint_diff.sh https://raw.githubusercontent.com/sardana-org/sardana/develop/ci/flake8_diff.sh && \
          sed -i 's+=sardana-org/sardana+=ska-sa/mkat-tango+g' lint_diff.sh && \
          sed -i 's+develop+master+g' lint_diff.sh && \
          sed -i 's+--show-source "$@"+--show-source "$@" --config=setup.cfg+g' lint_diff.sh && \
          chmod +x lint_diff.sh
      - name: Static analysis
        run: |
          pylint ./mkat_tango --output-format=parseable --exit-zero > pylint.out && \
          ./lint_diff.sh
      - name: Install dependencies
        run: |
          sudo pip3 install nose nose_xunitmp
      - name: Install test requirements
        run: |
          sudo pip3 install numpy mock
      - name: Install and run tests for Python 3.7
        run: |
          sudo python3 -m pip install -U . && \
          sudo python3 -m nose --with-xunitmp
